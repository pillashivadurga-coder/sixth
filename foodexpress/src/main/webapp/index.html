<!DOCTYPE html>
<html>
<head>
    <title>My First Styled Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: #0078D7;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background-color: #0078D7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005A9E;
        }
    </style>
</head>

<body>
    <h1>Welcome to HTML & CSS</h1>
    <p>This page is styled using CSS.</p>
    <button>Click Me</button>
</body>
</html>
